name: Verify Rebuild
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LINKAGE_FIXTURE_DIR: ${{ github.workspace }}/examples
      REQUIRE_LEGACY_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/rebuild/requirements-cad.txt
      - run: npm ci --legacy-peer-deps=false --force=false
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          CAD_PYTHON: python
      - run: npm run test:tooling
      - run: npm run build
      - run: npm audit --omit=dev
      - run: node scripts/rebuild/prepare-browser.mjs --config-only --install-tooling
      - run: node .rebuild.local/tooling/node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: node scripts/rebuild/verify-g10-production.mjs chromium --bundled-chromium
      - run: node scripts/rebuild/verify-g10-production.mjs webkit
      - run: node scripts/rebuild/verify-examples-browser.mjs chromium --bundled-chromium
      - run: node scripts/rebuild/verify-examples-browser.mjs webkit
