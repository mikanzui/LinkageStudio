# Build and deploy the Vite app to GitHub Pages.
# Repo settings → Pages → Build and deployment → Source: GitHub Actions.
#
# If deploy fails with: Branch "main" is not allowed to deploy to github-pages:
#   Repo → Settings → Environments → github-pages → Deployment branches
#   → allow `main` (e.g. “Selected branches” and add main + master), or “All branches”.

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
