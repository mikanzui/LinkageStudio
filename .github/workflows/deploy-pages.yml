name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAD_PYTHON: python
      REQUIRE_LEGACY_FIXTURES: '1'
      LINKAGE_FIXTURE_DIR: ${{ github.workspace }}/examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/rebuild/requirements-cad.txt
      - run: npm ci --legacy-peer-deps=false --force=false
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:tooling
      - run: npm audit --omit=dev
      - name: Build normal production artifact
        run: npm run build
      - name: Prepare browser tooling and authorized public compatibility examples
        run: node scripts/rebuild/prepare-browser.mjs --config-only --install-tooling
      - run: node .rebuild.local/tooling/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Chromium production, offline, update and credit checks
        run: node scripts/rebuild/verify-g10-production.mjs chromium --bundled-chromium
      - name: WebKit production, offline, update and credit checks
        run: node scripts/rebuild/verify-g10-production.mjs webkit
      - name: Native production selection, CAD trim and offline examples
        run: node scripts/rebuild/run-drawing-gate.mjs --production --bundled-chromium
      - name: Chromium Projects examples, legacy handle motion and save-reopen
        run: node scripts/rebuild/verify-examples-browser.mjs chromium --bundled-chromium
      - name: WebKit Projects examples, tablet layout and save-reopen
        run: node scripts/rebuild/verify-examples-browser.mjs webkit
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
